<!DOCTYPE html>
<html lang="id">
<head>

<title>GetahPasti – Prototipe</title>
<meta name="description" content="Prototipe GetahPasti: petani karet dibayar 90% di hari setor dari dana deposit pabrik di rekening escrow bank mitra. Semua data adalah ilustrasi.">
<meta name="theme-color" content="#1B4D33">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 80'%3E%3Cpath d='M32 3C26 14 6 36 6 53c0 14.4 11.6 25 26 25s26-10.6 26-25C58 36 38 14 32 3z' fill='%231B4D33'/%3E%3Cpath d='M18.5 49.5c0-4.5 1.6-8.6 4-12' stroke='%239DB5A5' stroke-width='4.5' stroke-linecap='round' fill='none'/%3E%3Cpath d='M20 55l8.5 8.5L45 44' stroke='%23F2C230' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --hijau: #1B4D33;          /* hijau tua logo: warna utama */
    --hijau-hover: #143A26;
    --hijau-muda: #E4EDE7;
    --hijau-status: #1F6F4A;   /* hijau status (aman/selesai) tetap, agar maknanya sama */
    --emas: #C99A14;           /* emas logo: aksen & kata "Pasti" */
    --emas-teks: #7D600A;      /* emas digelapkan untuk teks kecil (kontras >= 4,5:1) */
    --emas-muda: #F7EBC4;
    --kuning: #F2C230;
    --kilau: #9DB5A5;
    --amber-teks: #8F5E00;     /* amber untuk teks kecil (kontras >= 4,5:1) */
    --fokus: #7D600A;
    --bayangan-1: 0 1px 2px rgba(27,77,51,.06), 0 2px 8px rgba(27,77,51,.05);
    --bayangan-2: 0 2px 4px rgba(27,77,51,.06), 0 10px 28px rgba(27,77,51,.10);
    --amber: #E8A33D;
    --krem: #F6F1E7;
    --merah: #C0392B;
    --teks: #3F3F3F;
    --putih: #FFFFFF;
    --garis: #E6DFD2;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--krem); color: var(--teks); font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.5; }
  h1, h2, h3, .font-judul { font-family: 'Poppins', sans-serif; color: var(--hijau); }
  button { font-family: inherit; font-size: 15px; min-height: 48px; border-radius: var(--radius); cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  /* ---------- Bilah atas & tab ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--putih); border-bottom: 1px solid var(--garis);
    display: flex; align-items: center; gap: 24px; padding: 0 24px; min-height: 64px;
  }
  .logo { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 20px; color: var(--hijau); background: none; border: none; padding: 0 4px; }
  .logo span { color: var(--emas); }
  .tabs { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
  .tab {
    background: none; border: none; border-bottom: 3px solid transparent; border-radius: 0;
    padding: 0 16px; color: var(--teks); font-weight: 500; white-space: nowrap; min-height: 64px;
  }
  .tab:hover { color: var(--hijau); }
  .tab.aktif { color: var(--hijau); border-bottom-color: var(--hijau); font-weight: 600; }
  .label-proto {
    font-size: 12px; font-weight: 600; color: var(--emas-teks);
    background: var(--emas-muda); border-radius: 999px; padding: 4px 10px; white-space: nowrap;
  }

  main { padding: 32px 40px 96px; }

  /* ---------- Cover ---------- */
  .cover { max-width: 1040px; margin: 0 auto; text-align: center; }
  .cover .label-proto { display: inline-block; margin-bottom: 20px; }
  .cover h1 { font-size: 56px; line-height: 1.1; }
  .cover h1 span { color: var(--emas); }
  .cover .tagline { font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 600; color: var(--emas-teks); margin-top: 4px; }
  .cover .intro { max-width: 620px; margin: 16px auto 40px; font-size: 16px; }
  .kartu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .kartu {
    background: var(--putih); border: 1px solid var(--garis); border-radius: var(--radius);
    padding: 28px 24px; text-align: left; min-height: 200px;
    display: flex; flex-direction: column; gap: 10px;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .kartu:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(27,77,51,.12); border-color: var(--hijau); }
  .kartu .ikon { width: 48px; height: 48px; border-radius: var(--radius); background: var(--hijau-muda); color: var(--hijau); display: grid; place-items: center; font-size: 24px; }
  .kartu h3 { font-size: 19px; }
  .kartu p { font-size: 14px; flex: 1; }
  .kartu .buka { color: var(--hijau); font-weight: 600; font-size: 14px; }
  .catatan { margin-top: 36px; font-size: 14px; color: #666; }

  /* ---------- Bingkai ponsel ---------- */
  .ponsel-wrap { display: flex; justify-content: center; }
  .ponsel {
    width: 360px; height: 800px; background: var(--putih);
    border: 10px solid #222; border-radius: 36px; overflow: hidden;
    display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,.18);
  }
  .status-bar { height: 28px; background: #111; color: #fff; font-size: 12px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; flex-shrink: 0; }
  .app-header { background: var(--hijau); color: #fff; padding: 14px 16px; flex-shrink: 0; }
  .app-header .judul { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 17px; }
  .app-header .sub { font-size: 13px; opacity: .85; }
  .app-isi { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  /* ---------- Dasbor ---------- */
  .dasbor { max-width: 1280px; margin: 0 auto; }
  .dasbor-head { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  .dasbor-head h2 { font-size: 26px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }

  /* ---------- Komponen umum ---------- */
  .panel { background: var(--putih); border: 1px solid var(--garis); border-radius: var(--radius); padding: 16px; }
  .panel h4 { font-family: 'Poppins', sans-serif; color: var(--hijau); font-size: 15px; margin-bottom: 8px; }
  .kpi-label { font-size: 13px; color: #666; }
  .kpi-nilai { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 600; color: var(--hijau); }
  .baris { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 6px 0; border-bottom: 1px solid #f0ebe0; }
  .baris:last-child { border-bottom: none; }
  .chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .chip-emas { background: #FBEFD5; color: #8A5A00; }
  .chip-perak { background: #ECEEF0; color: #555; }
  .chip-perunggu { background: #F1E4D6; color: #7A4B2A; } /* warna tingkat perunggu tetap */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #f0ebe0; }
  th { font-weight: 600; color: var(--hijau); background: #FAF7F1; }
  td.angka, th.angka { text-align: right; font-variant-numeric: tabular-nums; }
  .selisih-ok { color: var(--hijau-status); font-weight: 600; }
  .selisih-warn { color: var(--amber-teks); font-weight: 600; }
  .selisih-besar { color: var(--merah); font-weight: 600; }
  .btn-utama { background: var(--hijau); color: #fff; border: none; padding: 0 20px; font-weight: 600; width: 100%; }
  .btn-utama:hover { background: var(--hijau-hover); }

  [hidden] { display: none !important; }

  /* ---------- Aplikasi Operator ---------- */
  .op-head { display: flex; align-items: center; gap: 6px; padding: 8px 12px; min-height: 64px; }
  .btn-kembali { background: none; border: none; color: #fff; font-size: 22px; width: 48px; min-height: 48px; flex-shrink: 0; }
  .btn-kembali:hover { background: rgba(255,255,255,.14); }
  .app-footer { padding: 12px 16px; border-top: 1px solid var(--garis); background: #fff; flex-shrink: 0; }
  .app-nav { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--garis); background: #fff; flex-shrink: 0; }
  .app-nav button { background: none; border: none; border-radius: 0; min-height: 60px; font-size: 12px; color: #666; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .app-nav button .ik { font-size: 18px; }
  .app-nav button.aktif { color: var(--hijau); font-weight: 600; box-shadow: inset 0 3px 0 var(--hijau); }
  .btn-utama:disabled { opacity: .45; cursor: not-allowed; }
  .btn-besar { min-height: 64px; font-size: 18px; font-family: 'Poppins', sans-serif; }
  .btn-garis { background: #fff; color: var(--hijau); border: 2px solid var(--hijau); font-weight: 600; width: 100%; padding: 0 16px; }
  .btn-garis:hover { background: #F3F9F5; }
  .btn-teks { background: none; border: none; color: var(--hijau); font-weight: 600; width: 100%; }
  .field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .field input { width: 100%; min-height: 48px; border: 1.5px solid var(--garis); border-radius: var(--radius); padding: 0 14px; font-size: 16px; font-family: inherit; color: var(--teks); background: #fff; }
  .field input:focus { outline: none; border-color: var(--hijau); box-shadow: 0 0 0 3px rgba(27,77,51,.15); }
  .input-satuan { position: relative; }
  .input-satuan input { padding-right: 48px; }
  .input-satuan span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #666; font-size: 14px; }
  .hint { font-size: 13px; color: #666; margin-top: 4px; }
  .dua-kolom { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .harga-card { background: var(--hijau); color: #fff; border-radius: var(--radius); padding: 16px; }
  .harga-card .kecil { font-size: 13px; opacity: .9; }
  .harga-card .besar { font-family: 'Poppins', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.3; }
  .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mini { background: #FAF7F1; border-radius: var(--radius); padding: 10px; }
  .mini .l { font-size: 12px; color: #666; }
  .mini .v { font-family: 'Poppins', sans-serif; font-weight: 600; color: var(--hijau); font-size: 16px; }
  .item-petani { display: flex; align-items: center; justify-content: space-between; width: 100%; background: #fff; border: 1px solid var(--garis); padding: 0 14px; min-height: 60px; text-align: left; color: var(--teks); }
  .item-petani:hover { border-color: var(--hijau); background: #F3F9F5; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--hijau-muda); color: var(--hijau); display: grid; place-items: center; font-weight: 600; font-family: 'Poppins', sans-serif; flex-shrink: 0; }
  .hitung { background: var(--hijau-muda); border-radius: var(--radius); padding: 14px; }
  .hitung h4 { font-family: 'Poppins', sans-serif; color: var(--hijau); font-size: 14px; margin-bottom: 4px; }
  .hitung .baris { border-color: rgba(27,77,51,.15); align-items: center; }
  .baris small { color: #666; font-size: 12px; }
  .baris.total { font-weight: 700; color: var(--hijau); font-size: 16px; }
  .foto-dummy { height: 150px; border-radius: var(--radius); background: repeating-linear-gradient(45deg,#cfb48f 0 14px,#c4a780 14px 28px); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.45); gap: 2px; }
  .foto-dummy .ik { font-size: 30px; }
  .opsi { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--garis); border-radius: var(--radius); padding: 12px; cursor: pointer; background: #fff; font-size: 14px; }
  .opsi.dipilih { border-color: var(--hijau); background: #F3F9F5; }
  .opsi input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--hijau); flex-shrink: 0; }
  .opsi small { display: block; color: #666; font-size: 13px; margin-top: 2px; }
  .catatan-wajib { background: #FDF3E1; border-left: 4px solid var(--amber); border-radius: 8px; padding: 10px 12px; font-size: 14px; font-weight: 600; color: #6b4a10; }
  .setuju { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; padding: 10px 0; }
  .setuju input { width: 22px; height: 22px; accent-color: var(--hijau); flex-shrink: 0; margin-top: 1px; }
  input[type=range] { width: 100%; accent-color: var(--hijau); height: 36px; cursor: pointer; }
  .skala { display: flex; justify-content: space-between; font-size: 12px; color: #666; }
  .status-box { display: flex; align-items: center; gap: 12px; border-radius: var(--radius); padding: 14px; font-weight: 600; font-size: 15px; }
  .status-box small { display: block; font-weight: 400; font-size: 13px; }
  .status-box.menunggu { background: #FDF3E1; color: #8A5A00; }
  .status-box.terkirim { background: var(--hijau-muda); color: var(--hijau-status); }
  .spinner { width: 30px; height: 30px; border: 3px solid #f0d9a8; border-top-color: var(--amber); border-radius: 50%; animation: putar .8s linear infinite; flex-shrink: 0; }
  @keyframes putar { to { transform: rotate(360deg); } }
  .centang { width: 34px; height: 34px; flex-shrink: 0; }
  .centang circle { fill: var(--hijau-status); transform-origin: 50% 50%; animation: muncul .3s ease-out; }
  .centang path { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; animation: gores .45s .25s ease-out forwards; }
  @keyframes muncul { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes gores { to { stroke-dashoffset: 0; } }
  .app-isi.masuk { justify-content: center; padding: 28px 24px; gap: 18px; }
  .logo-besar { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 34px; color: var(--hijau); text-align: center; }
  .logo-besar span { color: var(--emas); }
  .luring { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: #666; }
  .titik { width: 8px; height: 8px; border-radius: 50%; background: var(--hijau); }
  .tips { background: #FDF3E1; border-radius: var(--radius); padding: 14px; font-size: 14px; border-left: 4px solid var(--amber); }
  .tips b { color: #6b4a10; }
  .baris.saya { background: #F3F9F5; margin: 0 -8px; padding: 6px 8px; border-radius: 8px; font-weight: 600; }
  .kosong { text-align: center; color: #666; font-size: 14px; padding: 20px; }
  .chip-status { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .chip-status.terkirim { background: var(--hijau-muda); color: var(--hijau-status); }
  .chip-status.menunggu { background: #FDF3E1; color: #8A5A00; }

  /* ---------- WhatsApp ---------- */
  .wa-head { display: flex; align-items: center; gap: 10px; background: #075E54; color: #fff; padding: 8px 12px; min-height: 60px; flex-shrink: 0; }
  .wa-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--hijau); display: grid; place-items: center; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 14px; border: 2px solid rgba(255,255,255,.3); flex-shrink: 0; }
  .wa-head .nama { font-weight: 600; font-size: 16px; }
  .wa-head .sub { font-size: 12px; opacity: .85; }
  .app-isi.wa-isi { background: #ECE5DD; padding: 12px 10px; gap: 8px; }
  .wa-tanggal { align-self: center; background: #E1F2FB; color: #555; font-size: 12px; padding: 4px 10px; border-radius: 8px; box-shadow: 0 1px 1px rgba(0,0,0,.06); text-align: center; }
  .bubble { position: relative; align-self: flex-start; background: #fff; border-radius: 12px; border-top-left-radius: 4px; padding: 8px 10px 20px; font-size: 14px; max-width: 90%; box-shadow: 0 1px 1px rgba(0,0,0,.1); }
  .bubble .jam { position: absolute; right: 8px; bottom: 3px; font-size: 11px; color: #666; }
  .bubble .rinci { margin: 6px 0; border-top: 1px dashed #ddd; border-bottom: 1px dashed #ddd; padding: 6px 0; }
  .bubble .rinci > div { display: flex; justify-content: space-between; gap: 10px; }
  .bubble .rinci b { color: #222; text-align: right; }
  .baru { animation: masukBubble .4s ease-out both; }
  @keyframes masukBubble { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
  .wa-balas { align-self: center; background: #fff; color: #075E54; border: none; font-weight: 600; padding: 0 20px; box-shadow: 0 1px 2px rgba(0,0,0,.12); margin-top: 4px; }
  .wa-balas:hover { background: #F2FBF7; }
  .wa-input { display: flex; gap: 8px; align-items: center; padding: 8px; background: #ECE5DD; flex-shrink: 0; }
  .wa-input .kolom { flex: 1; background: #fff; border-radius: 999px; padding: 10px 16px; color: #666; font-size: 14px; }
  .wa-input .kirim { width: 44px; height: 44px; border-radius: 50%; background: #075E54; color: #fff; display: grid; place-items: center; }

  /* ---------- Dasbor Pabrik ---------- */
  .dasbor-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
  .sidemenu { position: sticky; top: 88px; background: #fff; border: 1px solid var(--garis); border-radius: var(--radius); padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .sidemenu button { background: none; border: none; text-align: left; padding: 0 14px; color: var(--teks); font-weight: 500; display: flex; align-items: center; gap: 10px; }
  .sidemenu button:hover { background: #FAF7F1; }
  .sidemenu button.aktif { background: var(--hijau-muda); color: var(--hijau); font-weight: 600; }
  .sidemenu .badge { margin-left: auto; background: var(--amber); color: #fff; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; }
  .dasbor-isi { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  .dasbor-isi .kpi-grid { margin-bottom: 0; }
  .kpi-sub { font-size: 13px; color: #666; margin-top: 2px; }
  .kpi-kecil { background: #FAF7F1; }
  .kpi-kecil .kpi-nilai { font-size: 19px; }
  .kpi-tombol { text-align: left; font-family: inherit; cursor: pointer; color: inherit; }
  .kpi-tombol:hover { border-color: var(--hijau); }
  .judul-seksi { font-size: 17px; }
  .ket { font-size: 13px; color: #666; margin-bottom: 12px; }
  .grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart text { font-family: 'Inter', sans-serif; font-size: 12px; fill: #666; }
  .chart .grid { stroke: #EEE8DC; stroke-width: 1; }
  .chart .bar { fill: var(--hijau); }
  .chart [data-tip] { cursor: default; }
  .chart rect[data-tip]:hover { opacity: .85; }
  .tip { position: fixed; pointer-events: none; background: #2b2b2b; color: #fff; font-size: 13px; padding: 6px 10px; border-radius: 8px; z-index: 50; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); opacity: 0; transition: opacity .1s; }
  tr.klik { cursor: pointer; }
  tr.klik:hover td, tr.klik:focus td { background: #F7FAF8; }
  tr.klik:focus { outline: none; }
  tr.klik:focus-visible td { box-shadow: inset 0 2px 0 var(--amber), inset 0 -2px 0 var(--amber); }
  tr.dipilih td { background: var(--hijau-muda) !important; font-weight: 600; }
  .qc-input { width: 84px; min-height: 44px; border: 1.5px solid var(--amber); border-radius: 8px; padding: 0 8px; font-size: 15px; font-family: inherit; text-align: right; background: #FFFBF2; }
  .qc-input:focus { outline: none; border-color: var(--hijau); box-shadow: 0 0 0 3px rgba(27,77,51,.15); }
  .btn-tabel { width: auto; min-width: 180px; padding: 0 12px; font-size: 13px; line-height: 1.25; }
  .tabel-rekon td { vertical-align: middle; }
  td.angka, th.angka, .chip-status { white-space: nowrap; }
  .chip-status.merah { background: #F8E1DE; color: var(--merah); }
  .mini-grid.tiga { grid-template-columns: repeat(3, 1fr); }
  .legenda { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--emas-teks); font-weight: 600; margin-bottom: 4px; }
  .garis-putus { width: 28px; border-top: 2px dashed var(--emas-teks); }
  @media (max-width: 960px) {
    .dasbor-layout { grid-template-columns: minmax(0, 1fr); }
    .dasbor-layout > * { min-width: 0; }
    .sidemenu { position: static; flex-direction: row; overflow-x: auto; }
    .sidemenu button { white-space: nowrap; }
    .grid-2, .mini-grid.tiga { grid-template-columns: minmax(0, 1fr); }

    ['L-2011-014', 'Sumber Rejeki', 'Yanti',  100, 52.0, 50.4, '20 Nov 2026']
  ];
  data.forEach(([lot, uppb, petani, berat, kkkOp, kkkQc, tanggal], i) => {
    const nilai = Math.round(berat * state.hargaHariIni);
    const hb = state.uppbTable.find(u => u.nama === uppb).holdback;
    const L = { lot, uppb, petani, berat, kkkOp, kkkQc, tanggal, koordinat: koordinat(petani), urut: i + 1,
                nilai, ditahan: Math.round(nilai * hb / 100), status: kkkQc == null ? 'menunggu' : 'selesai', pabrik: state.pabrik };
    if (L.status === 'selesai') Object.assign(L, hitungRekon(L, kkkQc));
    state.lots.push(L);
  });
})();

// Rekonsiliasi: penyesuaian = nilai ditahan x (selisih / KKK operator)
function hitungRekon(L, kkkQc) {
  const selisih = Math.round((L.kkkOp - kkkQc) * 10) / 10;
  const penyesuaian = Math.round(L.ditahan * selisih / L.kkkOp);
  return { selisih, penyesuaian, sisa: L.ditahan - penyesuaian };
}

// formatRupiah(1155000) -> "Rp1.155.000"
function formatRupiah(angka) {
  const n = Math.round(Number(angka) || 0);
  const tanda = n < 0 ? '-' : '';
  const digit = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return tanda + 'Rp' + digit;
}
// formatAngka(8200) -> "8.200" ; formatAngka(3.1, 1) -> "3,1"
function formatAngka(angka, desimal = 0) {
  const [bulat, pecahan] = Number(angka).toFixed(desimal).split('.');
  const b = bulat.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return pecahan ? b + ',' + pecahan : b;
}

function jamSekarang() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

  return 'L-2011-' + String(state.setoran.length + 1).padStart(3, '0');

// Inti hitungan. Contoh: 100 kg -> nilai 1.155.000, dibayar 1.039.500, ditahan 115.500
function hitungSetoran(d) {
  const berat = parseFloat(d.berat) || 0;
  const nilai = Math.round(berat * state.hargaHariIni);
  const dibayar = Math.round(nilai * 0.9);
  const ditahan = nilai - dibayar;
  const potongan = d.opsi === 'A' ? Math.round(nilai * d.persen / 100) : 0;
  return { berat, nilai, dibayar, ditahan, potongan, diterima: dibayar - potongan };
}
function timbangValid(d) {
  const b = parseFloat(d.berat), k = parseFloat(d.kkk);
  return b > 0 && k > 0 && k <= 100;
}
function pelunasanValid(d) { return d.opsi === 'tidak' || d.setuju; }

/* ---------- A6 Konfirmasi (setoran disimpan ke state.setoran) ---------- */
function simpanSetoran() {
  const d = state.op.draft;
  if (d.tersimpan) return;
  const p = cariPetani(d.petaniId), h = hitungSetoran(d);
  const rec = {
    id: 'S' + String(state.setoran.length + 1).padStart(3, '0'),
    lot: d.lot, petaniId: p.id, nama: p.nama, tingkat: p.tingkat,
    berat: h.berat, kkk: parseFloat(d.kkk), harga: state.hargaHariIni,
    nilai: h.nilai, dibayar: h.dibayar, ditahan: h.ditahan,
    opsi: d.opsi, persen: d.opsi === 'A' ? d.persen : 0,
    potongan: h.potongan, diterima: h.diterima,
    foto: d.foto, jam: jamSekarang(), status: 'menunggu'
  };
  state.setoran.push(rec);
  state.setoranTerakhir = rec;
  // Ikut ke dasbor pabrik: lot menunggu QC, escrow berkurang sebesar yang dibayar hari ini
  state.lots.push({
    lot: rec.lot, uppb: state.uppb, petani: p.nama, berat: rec.berat, kkkOp: rec.kkk, kkkQc: null,
    tanggal: state.tanggal + ', ' + rec.jam, koordinat: p.koordinat, urut: 1000 + state.setoran.length,
    nilai: rec.nilai, ditahan: rec.ditahan, status: 'menunggu', pabrik: state.pabrik, setoranId: rec.id
  });
  state.saldoEscrow -= rec.dibayar;
  state.terpakaiMingguIni += rec.dibayar;
  state.wa.tahap = 1;
  d.tersimpan = true;
  d.recId = rec.id;
  // Simulasi instruksi pembayaran ke bank mitra
  setTimeout(() => {
    rec.status = 'terkirim';
    if (state.tabAktif === 'operator' && state.layarAktif === 'konfirmasi') render(true);
  }, 1800);
}

const LAYAR_OP = {
  masuk: opMasuk, beranda: opBeranda, pilih: opPilih, timbang: opTimbang,
  pelunasan: opPelunasan, konfirmasi: opKonfirmasi, rapor: opRapor,
  riwayat: opRiwayat, petani: opPetani
};
const BUTUH_DRAFT = ['timbang', 'pelunasan', 'konfirmasi'];

function viewOperator() {
  let l = state.layarAktif;
  if (BUTUH_DRAFT.includes(l) && !state.op.draft) l = state.layarAktif = 'beranda';
  if (l === 'konfirmasi' && !state.op.draft.tersimpan) l = state.layarAktif = 'pelunasan';
  return (LAYAR_OP[l] || opBeranda)();
}

function aksiOperator(aksi, data) {
  const op = state.op;
  switch (aksi) {
    case 'masuk':
      if (!op.hp.trim()) return;
      state.layarAktif = 'beranda'; break;
    case 'ke':
      state.layarAktif = data.ke; break;
    case 'setoran-baru':
      op.draft = null; op.cari = ''; state.layarAktif = 'pilih'; break;
    case 'pilih-petani':
      op.draft = { petaniId: data.id, lot: nomorLotBerikut(), berat: '', kkk: '', foto: false, jamFoto: '',
                   opsi: 'tidak', persen: 10, setuju: false, tersimpan: false };
      state.layarAktif = 'timbang'; break;
    case 'foto':
      op.draft.foto = true; op.draft.jamFoto = jamSekarang();
      render(true); return;
    case 'ke-pelunasan':
      if (!timbangValid(op.draft)) return;
      state.layarAktif = 'pelunasan'; break;
    case 'konfirmasi':
      if (!pelunasanValid(op.draft)) return;
      simpanSetoran(); state.layarAktif = 'konfirmasi'; break;
    default:
      if (AKSI_LAIN[aksi]) AKSI_LAIN[aksi](data);
      return;
  }
  render();
}

function inputOperator(kunci, el) {
  const op = state.op, d = op.draft;
  switch (kunci) {
    case 'hp': op.hp = el.value; break;
    case 'cari': op.cari = el.value; filterPetani(); break;
    case 'berat': case 'kkk': d[kunci] = el.value; updateTimbang(); break;
    case 'persen': d.persen = Number(el.value); updatePelunasan(); break;
    case 'setuju': d.setuju = el.checked; updatePelunasan(); break;
    case 'opsi': d.opsi = el.value; d.setuju = false; render(true); break;
    case 'pesanan': state.pesananMingguan = parseFloat(el.value); updatePrakiraan(); break;
    case 'qc': updateQc(Number(el.dataset.idx), el.value); break;
  }
}

      <div><div class="nama">GetahPasti ${ikon('terverifikasi', 16, 'ik-verif')}<span class="sr-only">(terverifikasi)</span></div><div class="sub">Akun bisnis resmi · ke ${w.sapaan} ${w.nama}</div></div>
    </div>`,
    kelasIsi: 'wa-isi',
    isi: chat,
    footer: `<div class="wa-input" aria-hidden="true"><span class="kolom">Ketik pesan</span><span class="kirim">${ikon('kirim', 20)}</span></div>`
  });
}

/* =========================================================
   DASBOR PABRIK
   C1 beranda · C2 prakiraan · C3 rapor UPPB · C4 rekonsiliasi · C5 EUDR
   ========================================================= */
const fmt1 = v => formatAngka(v, 1);
// Layar sempit (ponsel): grafik lebar digambar dengan kanvas lebih sempit agar teks tetap terbaca
const layarSempit = () => window.innerWidth < 600;
const fmtKg = v => formatAngka(v, v % 1 ? 1 : 0);
function volumeUppb(u) {
  const tambahan = u.nama === state.uppb ? state.setoran.reduce((a, s) => a + s.berat, 0) : 0;
  return u.kg + tambahan;
}
function totalVolume() { return state.uppbTable.reduce((a, u) => a + volumeUppb(u), 0); }
function selisihRata() { return state.uppbTable.reduce((a, u) => a + u.selisih, 0) / state.uppbTable.length; }
function uppbBerperingkat() { return [...state.uppbTable].sort((a, b) => a.selisih - b.selisih); }
function lotsUrut(daftar = state.lots) {
  const prio = l => (l.status === 'menunggu' ? 0 : 1);   // menunggu QC di atas, lalu terbaru
  return [...daftar].sort((a, b) => prio(a) - prio(b) || b.urut - a.urut);
}
function chipLot(status) {
  return status === 'selesai'
    ? `<span class="chip-status terkirim">${ikon('centang', 14)}Selesai</span>`
    : `<span class="chip-status menunggu">${ikon('jam', 14)}Menunggu QC</span>`;
}

/* ---------- Grafik (SVG buatan sendiri) ---------- */
function grafikGaris({ labels, nilai, fmtTip, yMin, yMax, ticks, fmtTick, acuan, acuanLabel, aria, tampilLabel = () => true, W = 560, H = 240 }) {
  const pL = 44, pR = 20, pT = 18, pB = 30, n = nilai.length;
  const x = i => pL + i * (W - pL - pR) / (n - 1);
  const y = v => pT + (H - pT - pB) * (1 - (v - yMin) / (yMax - yMin));
  const grid = ticks.map(t => `<line class="grid" x1="${pL}" x2="${W - pR}" y1="${y(t)}" y2="${y(t)}"/><text x="${pL - 8}" y="${y(t) + 4}" text-anchor="end">${fmtTick(t)}</text>`).join('');
  const jangkar = i => (i === n - 1 ? 'end' : i === 0 ? 'start' : 'middle');   // label ujung tidak terpotong
  const xl = labels.map((l, i) => tampilLabel(i) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="${jangkar(i)}">${l}</text>` : '').join('');
  const d = nilai.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const acu = acuan != null
    ? `<line x1="${pL}" x2="${W - pR}" y1="${y(acuan)}" y2="${y(acuan)}" stroke="#E8A33D" stroke-width="2" stroke-dasharray="6 5"/>
       <text x="${pL + 6}" y="${y(acuan) + 16}" style="fill:#8A5A00;font-weight:600">${acuanLabel}</text>` : '';
  const titik = nilai.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="#1B4D33" stroke="#fff" stroke-width="2"/>`).join('');
  const hit = nilai.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="14" fill="transparent" data-tip="${labels[i]}: ${fmtTip(v)}"/>`).join('');
  return `<div class="chart-gulir"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">${grid}${acu}
    <path d="${d}" fill="none" stroke="#1B4D33" stroke-width="2" stroke-linejoin="round"/>${titik}${hit}${xl}</svg></div>`;
}
function grafikBatangH(items, fmt, aria) {
  const max = Math.max(...items.map(i => i.value));
  return `<div class="batang-daftar" role="img" aria-label="${aria}: ${items.map(it => `${it.label} ${fmt(it.value)}${it.ket ? ', selisih ' + it.ket : ''}`).join('; ')}">
    ${items.map((it, i) => `
    <div class="batang-baris" aria-hidden="true">
      <span class="batang-nama">${it.label}</span>
      <span class="batang-jalur"><span class="batang-isi" style="width:${(it.value / max * 100).toFixed(1)}%;background:${it.warna || '#1B4D33'};animation-delay:${i * 70}ms" data-tip="${it.label}: ${fmt(it.value)}${it.ket ? ' · ' + it.ket : ''}"></span></span>
      <span class="batang-nilai"><b>${fmt(it.value)}</b>${it.ket ? ` · ${it.ket}` : ''}</span>
    </div>`).join('')}
  </div>`;
}
function grafikBatangV({ labels, nilai, yMax, ticks, fmtTick, fmtTip, acuan, acuanLabel, warna, aria, W = 560, H = 260 }) {
  const pL = 44, pR = 20, pT = 22, pB = 30, n = nilai.length;
  const slot = (W - pL - pR) / n, bw = W <= 600 ? slot * 0.6 : Math.min(72, slot * 0.4);
  const y = v => pT + (H - pT - pB) * (1 - v / yMax);
  const grid = ticks.map(t => `<line class="grid" x1="${pL}" x2="${W - pR}" y1="${y(t)}" y2="${y(t)}"/><text x="${pL - 8}" y="${y(t) + 4}" text-anchor="end">${fmtTick(t)}</text>`).join('');
  const bars = nilai.map((v, i) => {
    const bx = pL + i * slot + (slot - bw) / 2;
    return `<rect x="${bx}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" rx="4" fill="${warna(v)}" data-tip="${labels[i]}: ${fmtTip(v)}"/>
      <text x="${bx + bw / 2}" y="${y(v) + 20}" text-anchor="middle" class="nilai-batang" style="fill:${warna(v) === '#E8A33D' ? '#3A2A00' : '#fff'}">${fmtTip(v)}</text>
      <text x="${bx + bw / 2}" y="${H - 8}" text-anchor="middle">${labels[i]}</text>`;
  }).join('');
  const acu = acuan > 0 && acuan <= yMax
    ? `<line x1="${pL}" x2="${W - pR}" y1="${y(acuan)}" y2="${y(acuan)}" stroke="#7D600A" stroke-width="2" stroke-dasharray="6 5"/>` : '';
  const legenda = acuanLabel ? `<div class="legenda"><span class="garis-putus"></span>${acuanLabel}</div>` : '';
  return `${legenda}<div class="chart-gulir"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">${grid}${acu}${bars}</svg></div>`;
}

/* ---------- C1 Beranda ---------- */
function pBeranda() {
  const vol = totalVolume();
  const dasar = state.uppbTable.reduce((a, u) => a + u.kg, 0);
  const nMenunggu = state.lots.filter(l => l.status === 'menunggu').length;
  const ton8 = state.volume8Minggu.ton.map((t, i, arr) => i === arr.length - 1 ? vol / 1000 : t);
  const label8 = state.volume8Minggu.label.map((l, i, arr) => i === arr.length - 1 ? l + ' (ini)' : l);
  const fee = vol * state.biayaLayananPerKg;
  const peringkat = uppbBerperingkat();
  const baris = state.uppbTable.map(u => `
    <tr class="klik" tabindex="0" data-aksi="p-uppb" data-nama="${u.nama}">
      <td><b>${u.nama}</b></td>
      <td class="angka">${fmtKg(volumeUppb(u))} kg</td>
      <td class="angka ${kelasSelisih(u.selisih)}">${fmt1(u.selisih)} poin</td>
      <td class="angka">${u.holdback}%</td>
      <td class="angka">#${peringkat.indexOf(u) + 1}</td>
      <td class="angka" style="color:var(--hijau);font-weight:600"><span class="tautan-ikon">Rapor ${ikon('panah', 16)}</span></td>
    </tr>`).join('');
  return `
    <div class="kpi-grid utama">
      <div class="panel kpi-utama"><div class="kpi-label">${ikon('perisai', 18)}Saldo escrow</div><div class="kpi-nilai">${formatRupiah(state.saldoEscrow)}</div><div class="kpi-sub">Rekening escrow bank mitra</div></div>
      <div class="panel"><div class="kpi-label">Terpakai minggu ini</div><div class="kpi-nilai">${formatRupiah(state.terpakaiMingguIni)}</div><div class="kpi-sub">Dibayarkan ke petani dari escrow</div></div>
      <div class="panel"><div class="kpi-label">Volume minggu ini</div><div class="kpi-nilai">${fmtKg(vol)} kg</div><div class="kpi-sub">${vol > dasar ? '+' + fmtKg(vol - dasar) + ' kg dari setoran hari ini' : '3 UPPB mitra'}</div></div>
      <div class="panel"><div class="kpi-label">Selisih KKK rata-rata</div><div class="kpi-nilai ${kelasSelisih(selisihRata())}">${fmt1(selisihRata())} poin</div><div class="kpi-sub">Rata-rata 3 UPPB, 3 bulan</div></div>
    </div>
    <div class="kpi-grid kecil">
      <div class="panel kpi-kecil"><div class="kpi-label">Biaya layanan minggu ini</div><div class="kpi-nilai">${formatRupiah(fee)}</div><div class="kpi-sub">${fmtKg(vol)} kg × ${formatRupiah(state.biayaLayananPerKg)}</div></div>
      <div class="panel kpi-kecil"><div class="kpi-label">Harga hari ini</div><div class="kpi-nilai">${formatRupiah(state.hargaHariIni)}/kg</div><div class="kpi-sub">Daftar harga pabrik · ${state.tanggal}</div></div>
      <button class="panel kpi-kecil kpi-tombol" data-aksi="p-menu" data-ke="rekon"><div class="kpi-label">Lot menunggu QC</div><div class="kpi-nilai" style="color:${nMenunggu ? '#8F5E00' : 'var(--hijau)'}">${nMenunggu} lot</div><div class="kpi-sub tautan-ikon">Buka Rekonsiliasi ${ikon('panah', 16)}</div></button>
    </div>
    <div class="grid-2">
      <div class="panel">
        <h3 class="judul-seksi">Volume per UPPB minggu ini</h3>
        <p class="ket">Kilogram getah yang disetor ke ${state.pabrik}. Warna batang menunjukkan selisih KKK.</p>
        <div class="legenda-status" aria-label="Arti warna batang">
          <span><i style="background:#1F6F4A"></i>Selisih &lt; 2 poin</span>
          <span><i style="background:#E8A33D"></i>2–5 poin</span>
          <span><i style="background:#C0392B"></i>&gt; 5 poin</span>
        </div>
        ${grafikBatangH(state.uppbTable.map(u => ({ label: u.nama, value: volumeUppb(u), warna: warnaSelisih(u.selisih), ket: fmt1(u.selisih) + ' poin' })), v => fmtKg(v) + ' kg', 'Grafik batang volume per UPPB, diwarnai menurut selisih KKK')}
      </div>
      <div class="panel">
        <h3 class="judul-seksi">Volume 8 minggu terakhir</h3>
        <p class="ket">Total semua UPPB, dalam ton</p>
        ${grafikGaris({ labels: label8, nilai: ton8, fmtTip: v => fmt1(v) + ' ton', yMin: 16, yMax: 22, ticks: [16, 18, 20, 22], fmtTick: t => t + ' t', aria: 'Grafik garis volume 8 minggu', W: 560, H: layarSempit() ? 320 : 240, tampilLabel: i => layarSempit() ? [1, 4, 7].includes(i) : i % 2 === 1 })}
      </div>
    </div>
    <div class="panel" style="padding:0;overflow-x:auto">
      <table>
        <thead><tr><th>UPPB</th><th class="angka">Volume minggu ini</th><th class="angka">Selisih KKK</th><th class="angka">Holdback</th><th class="angka">Peringkat</th><th></th></tr></thead>
        <tbody>${baris}</tbody>
      </table>
    </div>`;
}

/* ---------- C2 Prakiraan ---------- */
function isiPrakiraan() {
  const P = state.prakiraan, pes = state.pesananMingguan;
  const valid = pes > 0;
  const yMax = Math.max(25, Math.ceil(Math.max(...P.ton, valid ? pes : 0) / 5) * 5);
  const ticks = []; for (let t = 0; t <= yMax; t += 5) ticks.push(t);
  const chart = grafikBatangV({
    labels: P.label, nilai: P.ton, yMax, ticks, fmtTick: t => t + ' t', fmtTip: v => fmt1(v) + ' t',
    acuan: valid ? pes : null, acuanLabel: valid ? 'Pesanan mingguan ' + fmt1(pes) + ' t · batang amber = pasokan kurang' : '',
    warna: v => !valid || v >= pes ? '#1F6F4A' : '#E8A33D', aria: 'Grafik prakiraan pasokan 4 minggu', W: layarSempit() ? 560 : 1000, H: layarSempit() ? 340 : 300
  });
  const baris = P.ton.map((v, i) => {
    if (!valid) return `<tr><td>Minggu ${P.label[i]}</td><td class="angka">${fmt1(v)} t</td><td class="angka">—</td><td class="angka">—</td><td>—</td></tr>`;
    const beda = Math.round((v - pes) * 10) / 10;
    const status = beda >= 0
      ? `<span class="chip-status terkirim">${ikon('centang', 14)}Pasokan cukup</span>`
      : (-beda > pes * 0.1
        ? `<span class="chip-status merah">${ikon('silang', 14)}Kurang ${fmt1(-beda)} t</span>`
        : `<span class="chip-status menunggu">${ikon('peringatan', 14)}Kurang ${fmt1(-beda)} t</span>`);
    return `<tr><td>Minggu ${P.label[i]}</td><td class="angka">${fmt1(v)} t</td><td class="angka">${fmt1(pes)} t</td>
      <td class="angka ${beda >= 0 ? 'selisih-ok' : 'selisih-warn'}">${beda >= 0 ? '+' : '−'}${fmt1(Math.abs(beda))} t</td><td>${status}</td></tr>`;
  }).join('');
  const tabel = `<table><thead><tr><th>Minggu</th><th class="angka">Prakiraan pasokan</th><th class="angka">Pesanan</th><th class="angka">Selisih</th><th>Indikator</th></tr></thead><tbody>${baris}</tbody></table>`;
  let dana = '<div class="kosong">Isi pesanan mingguan untuk melihat kebutuhan dana.</div>';
  if (valid) {
    const butuh = Math.round(pes * 1000 * state.hargaHariIni);
    const minggu = Math.floor(state.saldoEscrow / butuh);
    dana = `<div class="mini-grid tiga">
      <div class="mini"><div class="l">Dana per minggu (pesanan × harga)</div><div class="v">${formatRupiah(butuh)}</div></div>
      <div class="mini"><div class="l">Saldo escrow saat ini</div><div class="v">${formatRupiah(state.saldoEscrow)}</div></div>
      <div class="mini"><div class="l">Saldo cukup untuk</div><div class="v" style="${minggu >= 2 ? '' : 'color:var(--amber-teks)'}">${minggu} minggu</div></div>
    </div>`;
  }
  return { chart, tabel, dana };
}
function pPrakiraan() {
  const x = isiPrakiraan();
  return `
    <div class="panel">
      <h3 class="judul-seksi">Prakiraan pasokan 4 minggu</h3>
      <p class="ket">Perkiraan getah masuk dari 3 UPPB mitra. Bandingkan dengan pesanan mingguan pabrik.</p>
      <div class="field" style="max-width:260px;margin-bottom:16px">
        <label for="pesanan">Pesanan mingguan</label>
        <div class="input-satuan"><input id="pesanan" type="number" inputmode="decimal" min="0" step="0.5" value="${state.pesananMingguan || ''}" data-input="pesanan"><span>ton</span></div>
      </div>
      <div id="prak-chart">${x.chart}</div>
    </div>
    <div class="panel" style="padding:0;overflow-x:auto" id="prak-tabel">${x.tabel}</div>
    <div class="panel"><h3 class="judul-seksi">Kebutuhan dana escrow</h3><div id="prak-dana" style="margin-top:8px">${x.dana}</div></div>`;
}
function updatePrakiraan() {
  const x = isiPrakiraan();
  document.getElementById('prak-chart').innerHTML = x.chart;
  document.getElementById('prak-tabel').innerHTML = x.tabel;
  document.getElementById('prak-dana').innerHTML = x.dana;
  labelTabel();
}

/* ---------- C3 Rapor UPPB ---------- */
function pRapor() {
  const urut = uppbBerperingkat();
  const u = state.uppbTable.find(x => x.nama === state.raporDipilih) || urut[0];
  const baris = urut.map((x, i) => `
    <tr class="klik ${x === u ? 'dipilih' : ''}" tabindex="0" data-aksi="p-uppb" data-nama="${x.nama}">
      <td class="angka" style="text-align:left">#${i + 1}</td><td><b>${x.nama}</b></td>
      <td class="angka">${fmtKg(volumeUppb(x))} kg</td>
      <td class="angka ${kelasSelisih(x.selisih)}">${fmt1(x.selisih)} poin</td>
      <td class="angka">${x.holdback}%</td>
    </tr>`).join('');
  const lots = lotsUrut(state.lots.filter(l => l.uppb === u.nama)).sort((a, b) => b.urut - a.urut);
  const barisLot = lots.map(l => `
    <tr><td>${l.lot}</td><td>${l.petani}</td><td>${l.tanggal}</td><td class="angka">${fmtKg(l.berat)} kg</td>
      <td class="angka">${fmt1(l.kkkOp)}%</td><td class="angka">${l.status === 'selesai' ? fmt1(l.kkkQc) + '%' : '—'}</td>
      <td class="angka ${l.status === 'selesai' ? kelasSelisih(Math.abs(l.selisih)) : ''}">${l.status === 'selesai' ? fmt1(l.selisih) + ' poin' : '—'}</td>
      <td>${chipLot(l.status)}</td></tr>`).join('');
  return `
    <div class="panel" style="padding:0;overflow-x:auto">
      <table>
        <thead><tr><th>Peringkat</th><th>UPPB</th><th class="angka">Volume minggu ini</th><th class="angka">Selisih KKK 3 bulan</th><th class="angka">Holdback</th></tr></thead>
        <tbody>${baris}</tbody>
      </table>
    </div>
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div>
          <h3 class="judul-seksi">${u.nama}: selisih KKK 3 bulan</h3>
          <p class="ket">Selisih mingguan antara KKK operator dan QC pabrik. Rata-rata ${fmt1(u.selisih)} poin · holdback ${u.holdback}%.</p>
        </div>
        <button class="btn-garis" style="width:auto" data-aksi="unduh-eudr" data-uppb="${u.nama}">${ikon('unduh', 20)}Unduh data asal-usul (EUDR)</button>
      </div>
      ${grafikGaris({ labels: state.labelTren12, nilai: u.tren, fmtTip: v => fmt1(v) + ' poin', yMin: 0, yMax: 7, ticks: [0, 2, 4, 6], fmtTick: t => t, acuan: 2, acuanLabel: 'Target < 2 poin (holdback 5%)', aria: 'Grafik garis selisih KKK ' + u.nama, W: layarSempit() ? 560 : 1000, H: layarSempit() ? 320 : 280, tampilLabel: i => !layarSempit() || i % 3 === 2 })}
    </div>
    <div class="panel" style="padding:0;overflow-x:auto">
      <div style="padding:16px 16px 0"><h3 class="judul-seksi">Lot terakhir · ${u.nama}</h3></div>
      <table>
        <thead><tr><th>Lot</th><th>Petani</th><th>Tanggal</th><th class="angka">Berat</th><th class="angka">KKK operator</th><th class="angka">KKK QC</th><th class="angka">Selisih</th><th>Status</th></tr></thead>
        <tbody>${barisLot || '<tr><td colspan="8" class="kosong">Belum ada lot.</td></tr>'}</tbody>
      </table>
    </div>`;
}

/* ---------- C4 Rekonsiliasi ---------- */
function selRekon(L, i) {
  const r = L.kkkQc != null ? hitungRekon(L, L.kkkQc) : null;
  const selisih = r ? `<span class="${kelasSelisih(Math.abs(r.selisih))}">${fmt1(r.selisih)} poin</span>` : '—';
  const hasil = r
    ? `<b>Sisa ${formatRupiah(r.sisa)}</b><br><small>${r.penyesuaian === 0 ? 'tanpa penyesuaian' : 'penyesuaian ' + (r.penyesuaian > 0 ? '−' : '+') + formatRupiah(Math.abs(r.penyesuaian))}</small>`
    : `<small>Ditahan ${formatRupiah(L.ditahan)}</small>`;
  return { r, selisih, hasil };
}
function pRekon() {
  const lots = lotsUrut();
  const nMenunggu = lots.filter(l => l.status === 'menunggu').length;
  const baris = lots.map(L => {
    const i = state.lots.indexOf(L), s = selRekon(L, i), tunggu = L.status === 'menunggu';
    return `<tr>
      <td><span><b class="nomor-lot">${L.lot}</b><br><small style="color:#666">${L.uppb} · ${L.petani}</small></span></td>
      <td class="angka">${fmtKg(L.berat)} kg</td>
      <td class="angka">${fmt1(L.kkkOp)}%</td>
      <td class="angka">${tunggu
        ? `<span class="qc-wrap"><input class="qc-input" type="number" inputmode="decimal" min="0" max="100" step="0.1" placeholder="—" value="${L.kkkQc ?? ''}" data-input="qc" data-idx="${i}" aria-label="KKK QC pabrik lot ${L.lot}">&nbsp;%</span>`
        : fmt1(L.kkkQc) + '%'}</td>
      <td class="angka" id="sel-${i}">${s.selisih}</td>
      <td class="angka" id="has-${i}">${s.hasil}</td>
      <td>${chipLot(L.status)}</td>
      <td>${tunggu
        ? `<button class="btn-utama btn-tabel" id="btn-setujui-${i}" data-aksi="setujui" data-idx="${i}" ${s.r ? '' : 'disabled'}>Setujui dan kirim sisa pembayaran</button>`
        : '<small style="color:#666">Sisa terkirim</small>'}</td>
    </tr>`;
  }).join('');
  return `
    <div class="panel">
      <h3 class="judul-seksi">Rekonsiliasi lot</h3>
      <p class="ket" style="margin:0">${nMenunggu} lot menunggu QC pabrik. Isi KKK hasil QC untuk menghitung sisa pembayaran.</p>
    </div>
    <div class="panel" style="padding:0;overflow-x:auto">
      <table class="tabel-rekon">
        <thead><tr><th>Lot</th><th class="angka">Berat</th><th class="angka">KKK operator</th><th class="angka">KKK QC pabrik</th><th class="angka">Selisih</th><th class="angka">Hasil</th><th>Status</th><th>Aksi</th></tr></thead>
        <tbody>${baris}</tbody>
      </table>
    </div>`;
}
function updateQc(i, nilai) {
  const L = state.lots[i];
  const v = parseFloat(nilai);
  L.kkkQc = v > 0 && v <= 100 ? v : null;
  const s = selRekon(L, i);
  document.getElementById('sel-' + i).innerHTML = s.selisih;
  document.getElementById('has-' + i).innerHTML = s.hasil;
  document.getElementById('btn-setujui-' + i).disabled = !s.r;
}
function setujuiLot(i) {
  const L = state.lots[i];
  if (L.status !== 'menunggu' || L.kkkQc == null) return;
  Object.assign(L, hitungRekon(L, L.kkkQc), { status: 'selesai' });
  state.saldoEscrow -= L.sisa;
  state.terpakaiMingguIni += L.sisa;
  render(true);
}

/* ---------- C5 Data asal-usul EUDR ---------- */
function buatCSV(lots) {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const kolom = ['Lot', 'UPPB', 'Petani', 'Koordinat kebun (contoh)', 'Tanggal setor', 'Berat (kg)', 'Pabrik tujuan'];
  const baris = lots.map(l => [l.lot, l.uppb, l.petani, l.koordinat, l.tanggal, l.berat, l.pabrik]);
  return '\uFEFF' + [kolom, ...baris].map(r => r.map(q).join(',')).join('\r\n');
}
function unduhCSV(lots, namaFile) {
  const csv = buatCSV(lots);
  try {
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = namaFile; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { /* unduhan diblokir lingkungan: pakai salinan teks di bawah */ }
  // Kotak pesan: konfirmasi + cadangan bila pratinjau (iframe) memblokir unduhan
  kotakPesan({
    judul: 'Ekspor CSV',
    isi: `<p>File <b>${namaFile}</b> (${lots.length} lot) sedang diunduh.</p>
      <p class="ket" style="margin:8px 0">Jika unduhan tidak berjalan (misalnya di jendela pratinjau), pilih teks di bawah lalu salin ke Excel atau Notepad.</p>
      <textarea id="csv-teks" class="csv-teks" readonly>${csv.replace(/^\uFEFF/, '').replace(/&/g, '&amp;').replace(/</g, '&lt;')}</textarea>`,
    tombol: [
      { label: 'Pilih semua teks', aksi: () => { const t = document.getElementById('csv-teks'); t.focus(); t.select(); }, tetapBuka: true, gaya: 'btn-garis' },
      { label: 'Tutup', gaya: 'btn-utama' }
    ]
  });
}

/* ---------- Kotak pesan buatan sendiri (pengganti alert/confirm) ---------- */
function kotakPesan({ judul, isi, tombol = [{ label: 'Tutup', gaya: 'btn-utama' }] }) {
  tutupKotakPesan();
  const latar = document.createElement('div');
  latar.className = 'modal-latar'; latar.id = 'kotak-pesan';
  latar.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-judul">
      <h3 id="modal-judul" class="judul-seksi">${judul}</h3>
      <div class="modal-isi">${isi}</div>
      <div class="modal-aksi">${tombol.map((t, i) => `<button class="${t.gaya || 'btn-utama'}" data-modal="${i}">${t.label}</button>`).join('')}</div>
    </div>`;
  latar.addEventListener('click', e => {
    if (e.target === latar) { tutupKotakPesan(); return; }
    const b = e.target.closest('[data-modal]');
    if (!b) return;
    e.stopPropagation();
    const t = tombol[Number(b.dataset.modal)];
    if (t.aksi) t.aksi();
    if (!t.tetapBuka) tutupKotakPesan();
  });
  document.body.appendChild(latar);
  const fokus = latar.querySelector('[data-modal]:last-child'); if (fokus) fokus.focus();
}
function tutupKotakPesan() {
  const k = document.getElementById('kotak-pesan');
  if (k) k.remove();
}
function pEudr() {
  const lots = [...state.lots].sort((a, b) => b.urut - a.urut);
  const baris = lots.map(l => `<tr><td><b>${l.lot}</b></td><td>${l.petani}<br><small style="color:#666">${l.uppb}</small></td>
    <td><span class="koordinat">${ikon('pin', 16)}${l.koordinat}</span></td><td>${l.tanggal}</td><td>${l.pabrik}</td></tr>`).join('');
  return `
    <div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div>
        <h3 class="judul-seksi">Data asal-usul (EUDR)</h3>
        <p class="ket" style="margin:0">${lots.length} lot tercatat. Koordinat kebun adalah contoh.</p>
      </div>
      <button class="btn-utama" style="width:auto" data-aksi="ekspor-csv">${ikon('unduh', 20)}Ekspor CSV</button>
    </div>
    <div class="panel" style="padding:0;overflow-x:auto">
      <table>
        <thead><tr><th>Lot</th><th>Petani</th><th>Koordinat kebun (contoh)</th><th>Tanggal setor</th><th>Pabrik tujuan</th></tr></thead>
        <tbody>${baris}</tbody>
      </table>
    </div>`;
}

function viewPabrik() {
  const menu = [['beranda', 'rumah', 'Beranda'], ['prakiraan', 'tren', 'Prakiraan'], ['rapor', 'grafik', 'Rapor UPPB'], ['rekon', 'timbangan', 'Rekonsiliasi'], ['eudr', 'bola', 'Data EUDR']];
  const nMenunggu = state.lots.filter(l => l.status === 'menunggu').length;
  const samping = `<nav class="sidemenu" aria-label="Menu dasbor">${menu.map(([k, ik, l]) =>
    `<button class="${state.pabrikMenu === k ? 'aktif' : ''}" data-aksi="p-menu" data-ke="${k}" ${state.pabrikMenu === k ? 'aria-current="page"' : ''}>${ikon(ik, 20)}${l}${k === 'rekon' && nMenunggu ? `<span class="badge">${nMenunggu}</span>` : ''}</button>`).join('')}</nav>`;
  const isi = ({ beranda: pBeranda, prakiraan: pPrakiraan, rapor: pRapor, rekon: pRekon, eudr: pEudr }[state.pabrikMenu] || pBeranda)();
  return `
  <section class="dasbor">
    <div class="dasbor-head">
      <div><h2>Dasbor Pabrik</h2><div>${state.pabrik} · ${state.tanggal}</div></div>
      <span class="label-proto">Prototipe – data ilustrasi</span>
    </div>
    <div class="dasbor-layout">${samping}<div class="dasbor-isi">${isi}</div></div>
  </section>`;
}

/* ---------- Aksi WhatsApp & Pabrik ---------- */
const AKSI_LAIN = {
  'wa-lanjut': () => {
    state.wa.tahap = Math.min(3, state.wa.tahap + 1); render();
    const isi = document.getElementById('app-isi'); if (isi) isi.scrollTop = isi.scrollHeight;
  },
  'wa-ulang': () => { state.wa.tahap = 1; render(); },
  'p-menu': d => { state.pabrikMenu = d.ke; render(); window.scrollTo(0, 0); },
  'p-uppb': d => { state.raporDipilih = d.nama; state.pabrikMenu = 'rapor'; render(); },
  'setujui': d => setujuiLot(Number(d.idx)),
  'unduh-eudr': d => unduhCSV([...state.lots].filter(l => l.uppb === d.uppb).sort((a, b) => b.urut - a.urut),
                              'getahpasti-eudr-' + d.uppb.toLowerCase().replace(/\s+/g, '-') + '.csv'),
  'reset-demo': () => mulaiUlangDemo(),
  'ekspor-csv': () => unduhCSV([...state.lots].sort((a, b) => b.urut - a.urut), 'getahpasti-eudr-semua-lot.csv')
};

const VIEWS = { cover: viewCover, operator: viewOperator, whatsapp: viewWhatsapp, pabrik: viewPabrik };

/* =========================================================
   RENDER & NAVIGASI
   ========================================================= */
// render(true) = pertahankan posisi gulir di dalam ponsel
function render(pertahankanGulir = false) {
  const lama = document.getElementById('app-isi');
  const gulir = lama ? lama.scrollTop : 0;
  const app = document.getElementById('app');
  // Kunci layar: tab, layar operator, menu dasbor. Bila berubah, layar baru masuk dengan transisi singkat.
  const kunci = [state.tabAktif, state.tabAktif === 'operator' ? state.layarAktif : '', state.tabAktif === 'pabrik' ? state.pabrikMenu : ''];
  const sebelum = render.kunci || [];
  render.kunci = kunci;
  app.innerHTML = (VIEWS[state.tabAktif] || viewCover)();
  if (!pertahankanGulir) {
    let target = null;
    if (kunci[0] !== sebelum[0]) target = app.firstElementChild;
    else if (kunci[1] !== sebelum[1]) document.querySelectorAll('.ponsel > :not(.status-bar)').forEach(el => el.classList.add('layar-baru'));
    else if (kunci[2] !== sebelum[2]) target = document.querySelector('.dasbor-isi');
    if (target) target.classList.add('layar-baru');
  }
  document.querySelectorAll('.tab').forEach(t => {
    const aktif = t.dataset.view === state.tabAktif;
    t.classList.toggle('aktif', aktif);
    t.setAttribute('aria-selected', aktif);
  });
  if (pertahankanGulir) {
    const baru = document.getElementById('app-isi');
    if (baru) baru.scrollTop = gulir;
  }
  labelTabel();
  // Di layar sempit, pastikan tab & menu aktif terlihat di bilah yang bisa digulir
  [['.tabs', '.tab.aktif'], ['.sidemenu', 'button.aktif']].forEach(([wadah, aktif]) => {
    const w = document.querySelector(wadah), a = w && w.querySelector(aktif);
    if (!w || !a || w.scrollWidth <= w.clientWidth) return;
    const kiri = a.offsetLeft - w.offsetLeft;
    if (kiri < w.scrollLeft || kiri + a.offsetWidth > w.scrollLeft + w.clientWidth) w.scrollLeft = kiri - 8;
  });
}

// Salin judul kolom ke tiap sel (data-label) agar tabel bisa tampil sebagai kartu di ponsel
function labelTabel() {
  document.querySelectorAll('.dasbor table').forEach(t => {
    const judul = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => td.setAttribute('data-label', judul[i] || '')));
  });
}

// Pindah tab: cukup ubah state lalu render ulang (tanpa URL/riwayat browser, aman di iframe)
function pindahView(tab) {
  state.tabAktif = VIEWS[tab] ? tab : 'cover';
  window.scrollTo(0, 0);
  render();
}

// Satu listener klik: data-aksi (aksi di dalam aplikasi) lalu data-view (pindah tampilan)
document.addEventListener('click', e => {
  const aksi = e.target.closest('[data-aksi]');
  if (aksi) { aksiOperator(aksi.dataset.aksi, aksi.dataset); return; }
  const el = e.target.closest('[data-view]');
  if (el) pindahView(el.dataset.view);
});
// Input ketik & penggeser: update sebagian layar saja agar kursor tidak hilang
document.addEventListener('input', e => {
  const k = e.target.dataset.input;
  if (k && k !== 'opsi' && k !== 'setuju') inputOperator(k, e.target);
});
document.addEventListener('change', e => {
  const k = e.target.dataset.input;
  if (k === 'opsi' || k === 'setuju') inputOperator(k, e.target);
});
// Enter di kolom HP = Masuk; Enter/Spasi di baris tabel yang bisa diklik; Esc menutup kotak pesan
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') tutupKotakPesan();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.input === 'hp') aksiOperator('masuk', {});
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-aksi]')) {
    e.preventDefault(); aksiOperator(e.target.dataset.aksi, e.target.dataset);
  }
});
// Tooltip grafik
const tip = document.createElement('div');
tip.className = 'tip'; tip.setAttribute('role', 'tooltip');
document.body.appendChild(tip);
document.addEventListener('mouseover', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.style.opacity = 0; return; }
  const r = t.getBoundingClientRect();
  tip.textContent = t.getAttribute('data-tip');
  tip.style.left = (r.left + r.width / 2) + 'px';
  tip.style.top = r.top + 'px';
  tip.style.opacity = 1;
});
window.addEventListener('scroll', () => { tip.style.opacity = 0; }, { passive: true });
let sempitSebelumnya = layarSempit();
window.addEventListener('resize', () => {
  clearTimeout(render.tundaResize);
  render.tundaResize = setTimeout(() => {
    if (layarSempit() !== sempitSebelumnya) { sempitSebelumnya = layarSempit(); if (state.tabAktif === 'pabrik') render(true); }
  }, 150);
});

/* =========================================================
   MULAI ULANG DEMO
   ========================================================= */
const STATE_AWAL = JSON.stringify(state);   // salinan semua angka awal

function tampilkanToast(teks) {
  const t = document.getElementById('toast');
  t.textContent = teks;
  t.classList.add('tampil');
  clearTimeout(tampilkanToast.timer);
  tampilkanToast.timer = setTimeout(() => t.classList.remove('tampil'), 2600);
}

function mulaiUlangDemo(diam = false) {
  const tabAktif = state.tabAktif;
  Object.keys(state).forEach(k => delete state[k]);
  Object.assign(state, JSON.parse(STATE_AWAL), { tabAktif });
  tutupKotakPesan();
  render();
  if (!diam) tampilkanToast('Demo dimulai ulang. Semua angka kembali ke awal.');
}

/* =========================================================
   UJI ALUR BAWAAN
   Jalankan dari konsol browser: ujiAlurDemo()
   cover → A1 → pilih petani → 100 kg, KKK 52 → Opsi A 20% → konfirmasi
   → WhatsApp → Dasbor C1 → C4 isi KKK QC 50,4 → setujui
   ========================================================= */
function ujiAlurDemo() {
  const hasil = [];
  const cek = (langkah, lulus, nilai = '') => hasil.push({ langkah, lulus: lulus ? '✓' : '✗ GAGAL', nilai: String(nilai) });
  const $ = s => document.querySelector(s);
  const klik = s => $(s).click();
  const isi = (s, v) => { const el = $(s); el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); };
  const centang = s => { const el = $(s); el.checked = true; el.dispatchEvent(new Event('change', { bubbles: true })); };
  const teks = () => $('#app').textContent.replace(/\s+/g, ' ');

  try {
    mulaiUlangDemo(true);
    pindahView('cover');
    cek('Cover tampil', teks().includes('Getah dibayar pasti') && !!$('.kartu[data-view=operator]'));
    const saldo0 = state.saldoEscrow, terpakai0 = state.terpakaiMingguIni, vol0 = totalVolume();

    klik('.kartu[data-view=operator]');
    cek('A1 layar masuk', state.tabAktif === 'operator' && state.layarAktif === 'masuk' && teks().includes('Selamat datang, Pak Dedi. UPPB Tani Makmur.'));
    klik('[data-aksi=masuk]');
    cek('A2 harga terkunci', teks().includes('Rp11.550/kg'));
    klik('[data-aksi=setoran-baru]');
    klik('[data-id=P001]');
    cek('A4 tombol Lanjut nonaktif saat kosong', $('#btn-lanjut').disabled);
    isi('#berat', '100'); isi('#kkk', '52');
    cek('A4 nilai = 100 × Rp11.550', $('#hit-nilai').textContent === 'Rp1.155.000', $('#hit-nilai').textContent);
    cek('A4 dibayar 90%', $('#hit-dibayar').textContent === 'Rp1.039.500', $('#hit-dibayar').textContent);
    cek('A4 ditahan 10%', $('#hit-ditahan').textContent === 'Rp115.500', $('#hit-ditahan').textContent);
    klik('#btn-lanjut');
    centang('input[value=A]'); isi('#persen', '20');
    cek('A5 potongan 20%', $('#hit-potongan').textContent === '−Rp231.000', $('#hit-potongan').textContent);
    cek('A5 diterima petani', $('#hit-diterima').textContent === 'Rp808.500', $('#hit-diterima').textContent);
    cek('A5 wajib centang persetujuan', $('#btn-lanjut').disabled);
    centang('[data-input=setuju]');
    klik('#btn-lanjut');
    const rec = state.setoranTerakhir;
    cek('A6 setoran tersimpan', state.setoran.length === 1 && rec.lot === 'L-2011-001', rec && rec.lot);

    klik('[data-view=whatsapp]');
    cek('B1 bukti setor dari setoran terakhir', teks().includes('Pak Slamet') && teks().includes(rec.lot) && teks().includes('Rp808.500'));

    state.pabrikMenu = 'beranda';
    pindahView('pabrik');
    cek('C1 volume naik 100 kg', totalVolume() - vol0 === 100, fmtKg(totalVolume()) + ' kg');
    cek('C1 saldo escrow turun Rp1.039.500 (90%)', saldo0 - state.saldoEscrow === 1039500, formatRupiah(state.saldoEscrow));
    cek('C1 terpakai naik Rp1.039.500', state.terpakaiMingguIni - terpakai0 === 1039500, formatRupiah(state.terpakaiMingguIni));
    cek('C1 angka tampil di layar', teks().includes(formatRupiah(state.saldoEscrow)) && teks().includes(fmtKg(totalVolume()) + ' kg'));
    cek('C1 biaya layanan ikut volume', teks().includes(formatRupiah(totalVolume() * state.biayaLayananPerKg)), formatRupiah(totalVolume() * state.biayaLayananPerKg));

    klik('[data-aksi=p-menu][data-ke=rekon]');
    const i = state.lots.findIndex(l => l.setoranId === rec.id);
    cek('C4 lot baru berstatus Menunggu QC', state.lots[i].status === 'menunggu');
    isi(`.qc-input[data-idx="${i}"]`, '50.4');
    cek('C4 selisih otomatis 1,6 poin', $('#sel-' + i).textContent.trim() === '1,6 poin', $('#sel-' + i).textContent.trim());
    cek('C4 tombol setujui aktif', !$('#btn-setujui-' + i).disabled);
    klik('#btn-setujui-' + i);
    const L = state.lots[i];
    cek('C4 lot selesai, sisa dikirim', L.status === 'selesai' && L.sisa === 111946, formatRupiah(L.sisa) + ' (penyesuaian −' + formatRupiah(L.penyesuaian) + ')');
    cek('C4 saldo escrow turun lagi sebesar sisa', saldo0 - state.saldoEscrow === 1039500 + L.sisa, formatRupiah(state.saldoEscrow));
  } catch (err) {
    cek('Galat saat uji', false, err.message);
  }

  console.table(hasil);
  const lulus = hasil.filter(h => h.lulus === '✓').length;
  tampilkanToast(`Uji alur: ${lulus}/${hasil.length} langkah lulus${lulus === hasil.length ? ' ✓' : ' — lihat konsol'}`);
  return hasil;
}

pindahView('cover');
</script>
